<polygon points="445,1420 427.7296507561772,1427.920545246155 427.7296507561772,1412.079454753845" fill="#107C10"/>
<text x="465" y="1427.08" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#000000">Result / response</text>
