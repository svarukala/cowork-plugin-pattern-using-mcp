<svg xmlns="http://www.w3.org/2000/svg" width="2460" height="1470" viewBox="0 0 2460 1470" role="img" aria-labelledby="title desc">
<title id="title">From a user question to a bounded LOB API result</title>
<desc id="desc">Generic Cowork MCP flow with secretless Entra SSO, an Entra-protected APIM MCP endpoint, a private adapter, and optional API-key LOB API access using managed identity and Key Vault.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="60" y="83.64" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700" fill="#000000">From a user question to a bounded LOB API result</text>
<text x="60" y="135.92000000000002" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#000000">Reusable target pattern | Single tenant | Read-only tools | APIM and adapter host are replaceable</text>
<rect x="360" y="205" width="740" height="180" rx="16" fill="#E8DAEF" stroke="#5C2D91" stroke-width="3"/>
<text x="384" y="258.47" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#000000">Microsoft Entra SSO + token store</text>
<text x="384" y="298.77000000000004" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#000000">Delegated access for the signed-in user</text>
<text x="384" y="339.07000000000005" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#000000">SSO client ID registration; no client secret</text>
<rect x="1210" y="205" width="760" height="180" rx="16" fill="#E8DAEF" stroke="#5C2D91" stroke-width="3"/>
<text x="1234" y="258.47" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#000000">Resource application binding</text>
<text x="1234" y="298.77000000000004" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#000000">SSO URI + Web consent callback</text>
<text x="1234" y="339.07000000000005" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#000000">Preauthorize the Microsoft token-store client</text>
<polyline points="1100,290 1210,290" fill="none" stroke="#5C2D91" stroke-width="4" stroke-dasharray="12 8"/>
<polygon points="1210,290 1192.729650756177,297.92054524615503 1192.729650756177,282.07945475384497" fill="#5C2D91"/>
<rect x="1010" y="470" width="880" height="855" rx="16" fill="none" stroke="#0078D4" stroke-width="3"/>
<text x="1035" y="517.84" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#000000">Customer Azure | public gateway + private adapter</text>
<rect x="60" y="595" width="245" height="270" rx="16" fill="#CFE4FA" stroke="#0078D4" stroke-width="3"/>
<text x="84" y="690.66" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#000000">1. User</text>
<text x="84" y="734.06" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#000000">Ask a business</text>
<text x="84" y="777.4599999999999" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400" fill="#000000">question</text>
<rect x="395" y="555" width="465" height="365" rx="16" fill="#CFE4FA" stroke="#0078D4" stroke-width="3"/>
<text x="419" y="657.715" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#000000">2. Cowork + plugin</text>
<text x="419" y="699.565" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000000">Select an approved tool</text>
<text x="419" y="741.4150000000001" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000000">Send structured arguments</text>
<text x="419" y="783.265" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000000">No conversation field</text>
<text x="419" y="825.115" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000000">in the sample tool schema</text>
<rect x="1060" y="570" width="325" height="335" rx="16" fill="#CFE4FA" stroke="#0078D4" stroke-width="3"/>
<text x="1084" y="663.625" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#000000">3. Public APIM</text>
<text x="1084" y="702.375" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#000000">Entra-protected /mcp</text>
<text x="1084" y="741.125" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#000000">Check tenant + scope</text>
<text x="1084" y="779.875" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#000000">Apply rate limit</text>
<text x="1084" y="818.625" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#000000">Forward /mcp</text>
<rect x="1480" y="570" width="355" height="335" rx="16" fill="#DFF6DD" stroke="#107C10" stroke-width="3"/>
<text x="1504" y="663.625" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#000000">4. Private MCP</text>
<text x="1504" y="702.375" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#000000">Revalidate user token</text>
<text x="1504" y="741.125" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#000000">Check tool permission</text>
<text x="1504" y="779.875" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#000000">Bound input / output</text>
<text x="1504" y="818.625" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#000000">One read operation</text>
<rect x="2040" y="570" width="355" height="335" rx="16" fill="#DFF6DD" stroke="#107C10" stroke-width="3"/>
<text x="2064" y="663.625" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#000000">5. LOB API</text>
<text x="2064" y="702.375" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#000000">Fixed HTTPS origin</text>
<text x="2064" y="741.125" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#000000">API key if required</text>
<text x="2064" y="779.875" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#000000">No user token</text>
<text x="2064" y="818.625" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#000000">Validate the response</text>
<polyline points="305,685 387,685" fill="none" stroke="#0078D4" stroke-width="4"/>
