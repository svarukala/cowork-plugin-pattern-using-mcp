<polygon points="868,845 885.2703492438228,837.079454753845 885.2703492438228,852.920545246155" fill="#107C10"/>
<polyline points="1385,685 1472,685" fill="none" stroke="#0078D4" stroke-width="4"/>
<polygon points="1472,685 1454.729650756177,692.920545246155 1454.729650756177,677.079454753845" fill="#0078D4"/>
<polyline points="1480,845 1393,845" fill="none" stroke="#107C10" stroke-width="4"/>
<polygon points="1393,845 1410.270349243823,837.079454753845 1410.270349243823,852.920545246155" fill="#107C10"/>
<polyline points="1835,685 2032,685" fill="none" stroke="#0078D4" stroke-width="4"/>
<polygon points="2032,685 2014.729650756177,692.920545246155 2014.729650756177,677.079454753845" fill="#0078D4"/>
<polyline points="2040,845 1843,845" fill="none" stroke="#107C10" stroke-width="4"/>
<polygon points="1843,845 1860.270349243823,837.079454753845 1860.270349243823,852.920545246155" fill="#107C10"/>
<text x="875" y="611.48" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#000000">HTTPS + JWT</text>
<text x="875" y="647.48" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#000000">MCP request</text>
<text x="1910" y="590.24" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#000000">HTTPS</text>
<text x="1910" y="627.24" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#000000">Backend key</text>
<text x="1910" y="664.24" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#000000">if required</text>
<polyline points="625,385 625,545" fill="none" stroke="#5C2D91" stroke-width="4" stroke-dasharray="12 8"/>
<polygon points="625,545 617.079454753845,527.7296507561772 632.920545246155,527.7296507561772" fill="#5C2D91"/>
<text x="650" y="447.08" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#000000">Delegated user token</text>
<rect x="1380" y="1120" width="455" height="160" rx="16" fill="#E8DAEF" stroke="#5C2D91" stroke-width="3"/>
<text x="1404" y="1166.28" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#000000">Key Vault (API-key variant)</text>
<text x="1404" y="1203.48" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#000000">Managed identity reads the key</text>
<text x="1404" y="1240.68" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#000000">Private endpoint + secret RBAC</text>
<polyline points="1790,905 1790,1110" fill="none" stroke="#5C2D91" stroke-width="4" stroke-dasharray="12 8"/>
<polygon points="1790,1110 1782.079454753845,1092.729650756177 1797.920545246155,1092.729650756177" fill="#5C2D91"/>
<text x="1480" y="997.08" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#000000">Separate backend credential</text>
<text x="1480" y="1037.08" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#000000">via managed identity</text>
<rect x="60" y="1110" width="900" height="185" rx="16" fill="#F3F2F1" stroke="#495057" stroke-width="3"/>
<text x="84" y="1168.78" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#000000">Azure Monitor | sanitized operational evidence</text>
<text x="84" y="1205.98" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#000000">Correlation IDs, time, latency, status, error category</text>
<text x="84" y="1243.18" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#000000">No prompt, token, key, or response-body capture</text>
<polyline points="1185,905 1185,1050 590,1050 590,1100" fill="none" stroke="#495057" stroke-width="4" stroke-dasharray="12 8"/>
<polygon points="590,1100 582.079454753845,1082.729650756177 597.920545246155,1082.729650756177" fill="#495057"/>
<text x="395" y="980.84" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000000">6. Results return through APIM.</text>
<text x="395" y="1024.84" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000000">Cowork summarizes for the user.</text>
<text x="60" y="1373.92" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#000000">HTTP 200 is not proof of tool success. Check MCP isError and the LOB API result.</text>
