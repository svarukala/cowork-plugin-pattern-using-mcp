<polygon points="1445,1420 1427.729650756177,1427.920545246155 1427.729650756177,1412.079454753845" fill="#495057"/>
<text x="1465" y="1427.08" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#000000">Sanitized telemetry</text>
