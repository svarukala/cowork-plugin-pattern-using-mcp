<svg xmlns="http://www.w3.org/2000/svg" width="2600" height="2020" viewBox="0 0 2600 2020" role="img" aria-labelledby="title desc">
<title id="title">Cowork MCP | Network and identity architecture</title>
<desc id="desc">Public APIM reaches a private Container Apps environment. The adapter calls an LOB API, optionally retrieves its key through a private Key Vault endpoint, and uses managed identity to pull its image. APIM and the adapter need outbound access to Entra signing keys.</desc>
<rect width="100%" height="100%" fill="white"/>
<text x="65" y="84.56" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="700" fill="#000000">Cowork MCP | Network and identity architecture</text>
<text x="65" y="142.84" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#000000">Example deployment | Azure public cloud | Other adapter hosts work | Illustrative subnets</text>
<rect x="65" y="195" width="2470" height="95" rx="16" fill="#E8DAEF" stroke="#5C2D91" stroke-width="3"/>
<text x="89" y="246.705" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#000000">Secretless SSO authenticates the user; managed identity authenticates the Azure workload.</text>
<rect x="100" y="345" width="495" height="190" rx="16" fill="#CFE4FA" stroke="#0078D4" stroke-width="3"/>
<text x="124" y="403.47" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#000000">Microsoft 365 Copilot Cowork</text>
<text x="124" y="443.77000000000004" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#000000">v1.28 plugin + OAuthPluginVault</text>
<text x="124" y="484.07000000000005" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="400" fill="#000000">Public gateway: HTTPS /mcp</text>
<rect x="780" y="335" width="835" height="205" rx="16" fill="#E8DAEF" stroke="#5C2D91" stroke-width="3"/>
<text x="804" y="402.375" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#000000">Microsoft Entra ID + Enterprise token store</text>
<text x="804" y="441.125" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#000000">Resource app + SSO auth config; no client secret</text>
<text x="804" y="479.875" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#000000">Delegated scope; token-store client preauthorized</text>
