<text x="1900" y="1702.08" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#000000">Preserve platform-managed resources.</text>
<text x="1900" y="1742.08" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#000000">Egress via NAT gateway or firewall.</text>
<text x="100" y="1873.0" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#000000">App ingress is VNet-visible within an internal environment; allow only the APIM subnet. Platform probes remain permitted.</text>
<text x="100" y="1913.0" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#000000">Allow outbound HTTPS from APIM and the adapter to Entra (signing keys), plus the LOB API, registry, and platform dependencies.</text>
