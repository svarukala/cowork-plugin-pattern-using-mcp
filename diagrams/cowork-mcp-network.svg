<text x="159" y="1707.0" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#000000">Application Insights + Log Analytics</text>
<text x="159" y="1745.75" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="400" fill="#000000">Sanitized status, correlation and latency; no prompt, token, key, or response-body capture</text>
<polyline points="560,1210 630,1210 630,1410 1020,1410 1020,1630 460,1630 460,1650" fill="none" stroke="#495057" stroke-width="4" stroke-dasharray="12 8"/>
