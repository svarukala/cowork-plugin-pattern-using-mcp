<text x="1114" y="1501.08" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#000000">User-assigned managed identity</text>
<text x="1114" y="1538.28" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#000000">Attached to adapter; not an extra network hop</text>
<text x="1114" y="1575.48" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#000000">Registry pull + Key Vault read (when needed)</text>
